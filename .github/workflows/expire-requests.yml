name: Expire requests and holds

# Free scheduler: marks purchase requests the seller didn't answer within 24h (and counter-offers
# the buyer didn't answer within 24h) as expired, and tidies older unpaid 30-minute holds.
# No email. Requests already read as expired even if this doesn't run. Seller-accepted requests
# are never auto-relisted: the seller decides.
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST https://benched.au/api/jobs/release-expired-holds
        run: |
          code=$(curl -s -o body.json -w '%{http_code}' -X POST --max-time 120 https://benched.au/api/jobs/release-expired-holds || echo 000)
          echo "HTTP $code"; cat body.json 2>/dev/null; echo
          [ "$code" = "200" ]
