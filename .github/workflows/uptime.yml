name: Uptime

# Free monitoring: pings production /api/health every 15 minutes.
# A failed run makes GitHub email the repo owner (default notification settings).
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check critical production endpoints (Health, Shoes, Cards, Coins, Pokemon, Sitemap)
        run: |
          ENDPOINTS=(
            "https://benched.au/api/health"
            "https://benched.au/shoes"
            "https://benched.au/cards"
            "https://benched.au/coins"
            "https://benched.au/pokemon"
            "https://benched.au/sitemap.xml"
          )
          FAILED=0
          for url in "${ENDPOINTS[@]}"; do
            OK=0
            for i in 1 2 3; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "$url" || echo 000)
              echo "$url (Attempt $i): HTTP $code"
              if [ "$code" = "200" ]; then OK=1; break; fi
              sleep 10
            done
            if [ "$OK" -ne 1 ]; then
              echo "::error::$url check failed"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then exit 1; fi
